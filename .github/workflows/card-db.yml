name: Update card database and decks
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      deck_code:
        description: '登録するデッキコード（空欄なら登録済みデッキとカードDBを更新）'
        required: false
        type: string
      deck_label:
        description: '一覧に表示するデッキ名（任意）'
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: card-db-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-db.mjs
      - name: Register and refresh decks
        run: node scripts/update-decks.mjs
        env:
          REGISTER_DECK_CODE: ${{ inputs.deck_code }}
          REGISTER_DECK_LABEL: ${{ inputs.deck_label }}
      - name: Save validated database and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db card-images decks
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated card database'
            git push
          fi
      - name: Build static site directory
        run: |
          mkdir _site
          cp -r db card-images decks index.html .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
